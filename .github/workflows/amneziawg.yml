name: AmneziaWG menu verification
on:
  push:
    paths: ['amneziawg.sh', 'amneziawg/**', '.github/workflows/amneziawg.yml']
  pull_request:
    paths: ['amneziawg.sh', 'amneziawg/**', '.github/workflows/amneziawg.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qrencode zbar-tools shellcheck
      - run: bash -n amneziawg.sh
      - run: shellcheck amneziawg.sh
      - run: python3 -m unittest discover -s amneziawg/tests -v
